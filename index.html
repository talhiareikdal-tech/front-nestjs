<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabs com API</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="tabs">
        <button class="tab-btn active" onclick="abrirTab(0)">Listar Alunos</button>
        <button class="tab-btn" onclick="abrirTab(1)">Cadastrar Aluno</button>
    </div>
    <a id="logout" class="logout-link" onclick="logout()">Logout</a>

    <!-- TAB 1 -->
    <div class="tab-content active">
        <h2>Alunos Cadastrados</h2>

        <div class="search-container">
            <input type="text" id="busca_nome" placeholder="Buscar por nome">
            <button onclick="buscarAlunos()">Buscar</button>
            <button onclick="listarAlunos()" style="background: #6c757d;">Limpar</button>
        </div>

        <div id="listaAlunos" class="client-list"></div>
    </div>

    <!-- TAB 2 -->
    <div class="tab-content">
        <h2>Cadastrar Aluno</h2>

        
        <input type="text" id="nome" placeholder="Nome">
        <input type="text" id="email" placeholder="Email">
        <input type="text" id="matricula" placeholder="Matricula">
        <input type="text" id="dataNascimento" placeholder="dataNascimento">
        

        <button onclick="cadastrarAluno()">Cadastrar Aluno</button>

        <div class="resultado" id="resultadoAluno"></div>
    </div>

    <script src="script.js"></script>

</body>

</html>
